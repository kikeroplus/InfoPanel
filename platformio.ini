[platformio]
; 機種は 2 つ。違いは include/board.h と src/sound_*.cpp にまとめてある (README の「機種」)
;   buzzer  … 初号機 (BL 付きの液晶、ブザー、スイッチ 4 個)
;   speaker … アンプとスピーカーの機体 (BL なしの液晶、MAX98357A、スイッチ 3 個)
; 書き込むときは機種を選ぶ: pio run -e buzzer -t upload / pio run -e speaker -t upload
; pio run (env を書かない) は両方をビルドするだけ (片方を直したらもう片方も壊れていないか確かめられる)
default_envs = buzzer, speaker

; 2 機種で共通。ESP32-S3-DevKitC-1 N16R8 (Flash 16MB QIO / PSRAM 8MB Octal)
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
monitor_speed = 115200
; 書き込みとシリアルモニタは基板の「COM」(UART) 側の USB 端子を使う。COM 番号が決まったら各 env に upload_port を書く
lib_deps =
  moononournation/GFX Library for Arduino@1.4.7
  tzapu/WiFiManager@2.0.17
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7

[env:buzzer]
build_flags =
  ${env.build_flags}
  -DBOARD_BUZZER
; upload_port = COM6

[env:speaker]
build_flags =
  ${env.build_flags}
  -DBOARD_SPEAKER
; upload_port = COM7
